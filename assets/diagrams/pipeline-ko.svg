<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="685" viewBox="0 0 1000 685" role="img"><title>pipeline system architecture</title><rect width="1000" height="685" fill="#ffffff"/>
<text x="32" y="38" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="700" fill="#172c32">별도로 생성되는 이미지와 라벨의 프레임 맞추기</text>
<text x="32" y="70" font-family="Malgun Gothic,Arial,sans-serif" font-size="16" font-weight="400" fill="#566d72">물리 계산과 이미지 저장 시점의 차이를 시간 기반 인덱스로 보정</text>
<text x="32" y="120" font-family="Malgun Gothic,Arial,sans-serif" font-size="16" font-weight="700" fill="#126b59">01  GPU 이미지 경로</text>
<rect x="32" y="143" width="230" height="105" rx="10" fill="#ffffff" stroke="#cddbd5" stroke-width="1.5"/>
<text x="47" y="172" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="700" fill="#172c32">카메라 RGB</text>
<text x="47" y="199" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">GPU 센서 데이터</text>
<text x="47" y="221" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">RSDA 플러그인 입력</text>
<rect x="320" y="143" width="280" height="105" rx="10" fill="#edf4ee" stroke="#126b59" stroke-width="1.5"/>
<text x="335" y="172" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="700" fill="#172c32">nvJPEG 인코딩 · 저장</text>
<text x="335" y="199" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">JPEG 이미지 생성</text>
<text x="335" y="221" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">센서 cycleNumber 기반 이름</text>
<polyline points="262,196 320,196" fill="none" stroke="#126b59" stroke-width="2.5" />
<polygon points="320,196 311.0,192.0 311.0,200.0" fill="#126b59"/>
<polyline points="600,196 665,196 665,282 715,282" fill="none" stroke="#126b59" stroke-width="2.5" />
<polygon points="715,282 706.0,278.0 706.0,286.0" fill="#126b59"/>
<text x="320" y="290" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#a95232">SimCore.Time 기반 라벨 인덱스</text>
<polyline points="460,301 460,348" fill="none" stroke="#a95232" stroke-width="2.5" stroke-dasharray="7 5"/>
<polygon points="460,348 464.0,339.0 456.0,339.0" fill="#a95232"/>
<text x="32" y="328" font-family="Malgun Gothic,Arial,sans-serif" font-size="16" font-weight="700" fill="#477b9e">02  CPU 라벨 경로</text>
<rect x="32" y="348" width="230" height="110" rx="10" fill="#ffffff" stroke="#cddbd5" stroke-width="1.5"/>
<text x="47" y="377" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="700" fill="#172c32">Ground Truth 객체</text>
<text x="47" y="404" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">3D 위치 · 크기 · 회전</text>
<text x="47" y="426" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">물리 센서 메타데이터</text>
<rect x="320" y="348" width="280" height="110" rx="10" fill="#edf4ee" stroke="#126b59" stroke-width="1.5"/>
<text x="335" y="377" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="700" fill="#172c32">3D → 2D 투영</text>
<text x="335" y="404" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">카메라 FOV · 해상도 반영</text>
<text x="335" y="426" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">YOLO 라벨 · 프레임 번호 생성</text>
<polyline points="262,403 320,403" fill="none" stroke="#477b9e" stroke-width="2.5" />
<polygon points="320,403 311.0,399.0 311.0,407.0" fill="#477b9e"/>
<polyline points="600,403 665,403 665,357 715,357" fill="none" stroke="#477b9e" stroke-width="2.5" />
<polygon points="715,357 706.0,353.0 706.0,361.0" fill="#477b9e"/>
<rect x="715" y="253" width="253" height="140" rx="10" fill="#edf4ee" stroke="#126b59" stroke-width="1.5"/>
<text x="730" y="282" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="700" fill="#172c32">이미지·라벨 대응</text>
<text x="730" y="309" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">Frame ID 기준 연결</text>
<text x="730" y="331" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">저장 파일명 규칙 정렬</text>
<text x="730" y="353" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">시간 오프셋 보정 반영</text>
<polyline points="840,393 840,489 525,489 525,517" fill="none" stroke="#126b59" stroke-width="2.5" />
<polygon points="525,517 529.0,508.0 521.0,508.0" fill="#126b59"/>
<rect x="32" y="517" width="936" height="96" rx="10" fill="#edf4ee" stroke="#126b59" stroke-width="1.5"/>
<text x="47" y="546" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" font-weight="700" fill="#172c32">기상 조건별 학습·평가 데이터</text>
<text x="47" y="573" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">동일 프레임의 JPEG 이미지와 YOLO 라벨을 묶어 데이터셋 구성</text>
<text x="47" y="595" font-family="Malgun Gothic,Arial,sans-serif" font-size="15" font-weight="400" fill="#566d72">생성 데이터로 모델 학습 및 기상 조건별 결과 비교</text>
<text x="32" y="657" font-family="Malgun Gothic,Arial,sans-serif" font-size="16" font-weight="700" fill="#126b59">핵심 역량: GPU/CPU 경로 연동 / 시간 기반 프레임 보정 / 좌표 변환</text>
</svg>